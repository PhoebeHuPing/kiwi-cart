name: Deploy Java Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'server-java/**'
      - '.github/workflows/deploy-java.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR
        working-directory: server-java
        run: ./gradlew bootJar

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_JAVA_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_JAVA_PUBLISH_PROFILE }}
          package: server-java/build/libs/*.jar
