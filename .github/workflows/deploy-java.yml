name: Build and deploy Java app to Azure Web App - kiwicart-api

on:
  push:
    branches:
      - main
      - deploy/java-backend
    paths:
      - 'server-java/**'
      - '.github/workflows/deploy-java.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        working-directory: ./server-java
        run: ./gradlew build -x test

      - name: Run tests
        working-directory: ./server-java
        run: ./gradlew test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: server-java/build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_JAVA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_JAVA_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_JAVA_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kiwicart-java-api'
          slot-name: 'Production'
          package: '*.jar'
