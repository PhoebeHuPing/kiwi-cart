name: CI

on:
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
        working-directory: server-dotnet
      - run: dotnet build --no-restore
        working-directory: server-dotnet
      - run: dotnet test --no-build
        working-directory: server-dotnet
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=test;Username=test;Password=test"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
