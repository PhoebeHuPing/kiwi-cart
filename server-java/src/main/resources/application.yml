server:
  port: 8080

spring:
  application:
    name: kiwicart-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_DOMAIN:https://your-tenant.au.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://kiwicart/api}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kiwicart;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://kiwicart.azurewebsites.net
  rate-limit:
    requests-per-minute: 60

supermarket:
  paknsave:
    base-url: https://www.paknsave.co.nz
    api-url: https://api-prod.paknsave.co.nz
  newworld:
    base-url: https://www.newworld.co.nz
    api-url: https://api-prod.newworld.co.nz
  woolworths:
    base-url: https://www.woolworths.co.nz

resilience4j:
  circuitbreaker:
    instances:
      foodstuffs:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      woolworths:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      foodstuffs:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      woolworths:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      foodstuffs:
        timeout-duration: 10s
      woolworths:
        timeout-duration: 10s
