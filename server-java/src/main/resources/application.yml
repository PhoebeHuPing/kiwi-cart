server:
  port: 8080

spring:
  application:
    name: kiwicart-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_DOMAIN:https://your-tenant.au.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://kiwicart/api}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://kiwicart.azurewebsites.net

supermarket:
  paknsave:
    base-url: https://www.paknsave.co.nz
    api-url: https://api-prod.paknsave.co.nz
  newworld:
    base-url: https://www.newworld.co.nz
    api-url: https://api-prod.newworld.co.nz
  woolworths:
    base-url: https://www.woolworths.co.nz
