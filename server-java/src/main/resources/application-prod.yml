server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kiwicart}
    username: ${DB_USER:kiwicart}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins:
      - https://kiwicart.azurewebsites.net
      - https://kiwi-cart.azurewebsites.net
  rate-limit:
    requests-per-minute: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

# Swagger disabled in production for security
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    nz.co.kiwicart: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
